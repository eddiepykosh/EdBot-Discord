# docker-compose.yml
# use only if building local image of container
# if your using docker-compose from dockerhub, use usage/docker-compose-from-dockerhub.yml
version: '3.8'

services:
  command:
    build: .
    command: python edbot_command.py
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs 
    restart: unless-stopped

  listener:
    build: .
    command: python edbot_listener.py
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs 
    restart: unless-stopped

  edbot-ai:
    build: .
    command: python edbot_ai.py
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs 
      - ./history:/app/history
    restart: unless-stopped

volumes:
  edbot-data:
